  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2937">ETL 十步流水线：两段 · 每步 AI 是谁 · 交什么 · 我怎么验收</text>
  <text x="20" y="56" font-size="10.5" font-weight="700" fill="#1d4ed8">第一段 · 数据段（第 0–5 步）——把原始导出变成可入库、可对账、能解释的数据</text>
