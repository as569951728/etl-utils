    <text x="199" y="295" font-size="9" fill="#64748b">数据治理顾问</text>
    <text x="199" y="312" font-size="9" fill="#334155">交：访谈稿 · 总账</text>
    <text x="199" y="327" font-size="9" fill="#334155">　　导出＋哈希</text>
  </g>
