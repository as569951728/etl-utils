  <text x="95" y="308" font-size="9.5" fill="#065f46" text-anchor="middle">＋ 访谈与业务目标</text>
  <text x="95" y="326" font-size="8.5" fill="#059669" text-anchor="middle">证据不足的标待核、不硬写</text>
