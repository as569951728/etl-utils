  <text x="783" y="272" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">交付</text>
  <text x="783" y="294" font-size="9" fill="#92400e" text-anchor="middle">可重跑 · 可回溯</text>
  <text x="783" y="310" font-size="9" fill="#92400e" text-anchor="middle">每个数都有出处</text>
  <text x="783" y="326" font-size="9" fill="#92400e" text-anchor="middle">每个缺口写在数旁</text>
  <text x="20" y="378" font-size="10" fill="#475569">每步验收同一套路：先跑断言（机器判）→ 独立检查者复查（新会话，只给证据不给代码）→ 我只抽 3 条最不像的</text>
  <text x="20" y="396" font-size="10" fill="#b45309">第 6 步是可前置、可回访的核实模块：影响含义与处理的疑点，须在清洗执行前确认</text>
</svg>
