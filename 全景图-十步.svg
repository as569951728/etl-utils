    <text x="589" y="295" font-size="9" fill="#64748b">数据交付顾问</text>
    <text x="589" y="312" font-size="9" fill="#334155">交：运行记录 · 标注</text>
    <text x="589" y="327" font-size="9" fill="#334155">　　预检 · 提交包</text>
