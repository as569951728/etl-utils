  <text x="490" y="190" font-size="10" fill="#475569" text-anchor="middle">交接物：清洗后的表 ＋ 对账报告 ＋ 隔离明细 ＋ 访谈证据</text>
  <text x="20" y="238" font-size="10.5" font-weight="700" fill="#047857">第二段 · 数据之后（第 6–9 步）——把数据变成别人敢用的结论：核实可前置与回访，再改模型、写清边界、最后交付</text>
  <rect x="20" y="250" width="150" height="92" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="95" y="272" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">输入</text>
